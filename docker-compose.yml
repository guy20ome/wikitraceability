services:
  database:
    image: mariadb:10.11
    container_name: mediawiki-db
    environment:
      MYSQL_ROOT_PASSWORD: wikiroot
      MYSQL_DATABASE: mediawiki
      MYSQL_USER: mediawiki
      MYSQL_PASSWORD: mediawikipass
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - mediawiki-network
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      start_period: 30s

  mediawiki:
    build: .
    container_name: mediawiki
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      MEDIAWIKI_DB_HOST: database
      MEDIAWIKI_DB_NAME: mediawiki
      MEDIAWIKI_DB_USER: mediawiki
      MEDIAWIKI_DB_PASSWORD: mediawikipass
      MEDIAWIKI_ADMIN_USER: Admin
      MEDIAWIKI_ADMIN_PASSWORD: admin123
      MEDIAWIKI_SITE_NAME: WikiTraceability
    volumes:
      - ./:/var/www/html/extensions/WikiTraceability:ro
      - ./LocalSettings2.php:/var/www/html/LocalSettings.php:ro
    networks:
      - mediawiki-network

volumes:
  db-data:

networks:
  mediawiki-network:
    driver: bridge
